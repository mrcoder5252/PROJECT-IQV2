services:
  project-iq:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project_iq_app
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      - PROJECTIQ_LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
