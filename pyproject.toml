[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-iq"
version = "1.0.0"
description = "Academic Project Intelligence Platform for Final-Year Engineering Reports"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Project-IQ Authors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "streamlit>=1.30.0",
    "chromadb>=0.4.20",
    "sentence-transformers>=2.2.2",
    "spacy>=3.7.0",
    "PyMuPDF>=1.23.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.22",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "tiktoken>=0.5.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]

[project.scripts]
project-iq = "run_pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "web*"]
